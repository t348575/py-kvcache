[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storage-kvcache"
version = "0.1.0"
description = "Python xNVMe-backed KV cache offloading for vLLM"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["storage_kvcache*"]
