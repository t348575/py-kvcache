[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-kvcache"
version = "0.1.0"
description = "Python liburing-backed KV cache offloading scaffold for vLLM"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["py_kvcache*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"